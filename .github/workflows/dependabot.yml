name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Only run for PRs opened by Dependabot in this repo.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: |
          # Basic sanity checks (do not print GH_TOKEN)
          echo "Repository: $GITHUB_REPOSITORY"
          echo "PR number: $PR_NUMBER"

          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN is empty - secrets.GITHUB_TOKEN not available in this run"
            exit 1
          fi

          # Enable auto-merge using the documented endpoint
          curl -i -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/auto-merge" \
            -d '{"merge_method":"merge"}' \
            --retry 3 \
            --retry-delay 1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

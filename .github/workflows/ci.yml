name: CI

on:
  pull_request:
  push:
    branches-ignore: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: lts/*
          cache: true
      - name: Check
        run: vp check
      - name: Test
        run: vp test

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540">
  <defs>
    <mask id="crescent1" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="180" height="180" fill="#fff"/>
      <circle cx="130" cy="50" r="62" fill="#000"/>
    </mask>
    <mask id="crescent2" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="180" height="180" fill="#fff"/>
      <circle cx="40" cy="140" r="62" fill="#000"/>
    </mask>
  </defs>
  <rect width="900" height="540" fill="#f2efe4"/>

  <!-- row 1 -->
  <g transform="translate(0,0)">
    <rect width="180" height="180" fill="#f2efe4" stroke="#d4cfc0" stroke-width="1"/>
    <circle cx="90" cy="90" r="46" fill="none" stroke="#111110" stroke-width="10"/>
  </g>
  <g transform="translate(180,0)">
    <rect width="180" height="180" fill="#f1b426" stroke="#d4cfc0" stroke-width="1"/>

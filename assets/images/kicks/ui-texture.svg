  </g>
  <g transform="translate(360,0)">
    <rect width="180" height="180" fill="#111110" stroke="#d4cfc0" stroke-width="1"/>
    <rect x="60" y="60" width="60" height="60" fill="#f1b426" transform="rotate(45 90 90)"/>
  </g>
  <g transform="translate(540,0)">
    <rect width="180" height="180" fill="#e8e4d8" stroke="#d4cfc0" stroke-width="1"/>
    <path d="M76,58 L76,122 L91,108 L100,128 L110,124 L101,104 L118,104 Z" fill="#111110"/>
  </g>
  <g transform="translate(720,0)">

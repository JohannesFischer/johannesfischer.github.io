    <path d="M55,95 L80,120 L128,64" fill="none" stroke="#111110" stroke-width="12" stroke-linecap="square"/>
  </g>
  <g transform="translate(180,180)">
    <rect width="180" height="180" fill="#e8e4d8" stroke="#d4cfc0" stroke-width="1"/>

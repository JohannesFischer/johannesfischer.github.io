    <g fill="#f1b426">
      <circle cx="65" cy="65" r="7"/><circle cx="90" cy="65" r="7"/><circle cx="115" cy="65" r="7"/>
      <circle cx="65" cy="90" r="7"/><circle cx="90" cy="90" r="7"/><circle cx="115" cy="90" r="7"/>
      <circle cx="65" cy="115" r="7"/><circle cx="90" cy="115" r="7"/><circle cx="115" cy="115" r="7"/>
    </g>
  </g>

  <!-- row 2 -->
